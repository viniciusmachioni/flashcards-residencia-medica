<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards USP Bauru — Residência Médica</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mut:#667085;--line:#e2e5ea;--acc:#1e88e5;--ok:#2e7d32;--no:#c62828;--sh:0 6px 24px rgba(20,30,50,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151c;--card:#1b2030;--ink:#e8ebf2;--mut:#98a2b3;--line:#2b3347;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#12151c;--card:#1b2030;--ink:#e8ebf2;--mut:#98a2b3;--line:#2b3347;--sh:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:16px;overflow:auto;max-height:100vh;position:sticky;top:0}
aside h1{font-size:17px;margin:0 0 4px}
aside .sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.area{margin:10px 0 4px;font-weight:700;font-size:13px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 8px;border-radius:8px}
.area:hover{background:var(--bg)}
.area i{width:10px;height:10px;border-radius:50%;display:inline-block}
.area .n{margin-left:auto;font-weight:500;color:var(--mut);font-size:12px}
.blk{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 8px 7px 26px;border-radius:8px;font-size:14px;line-height:1.3}
.blk:hover{background:var(--bg)}
.blk.on{background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:600}
.blk .t{flex:1}
.blk .p{font-size:11px;color:var(--mut);white-space:nowrap}
.blk .bar{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}
.blk .bar b{display:block;height:100%;background:var(--ok)}
.all{display:flex;gap:8px;margin-bottom:6px}
.all button,.tool button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px}
.all button.on,.tool button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{min-width:0;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.top{width:100%;max-width:760px;display:flex;flex-direction:column;gap:8px}
.crumb{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.crumb b{color:var(--ink)}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.prog div{height:100%;background:var(--c,var(--acc));transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);flex-wrap:wrap;gap:6px}
.tool{display:flex;gap:6px;flex-wrap:wrap}
.cardwrap{width:100%;max-width:760px;perspective:1400px}
.card{position:relative;width:100%;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:28px 30px;display:flex;flex-direction:column;justify-content:center;border-top:6px solid var(--c,var(--acc));overflow:auto}
.face.back{transform:rotateY(180deg)}
.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.txt{font-size:clamp(19px,2.6vw,25px);line-height:1.4}
.back .txt{font-size:clamp(17px,2.3vw,22px)}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut)}
.act{display:flex;gap:10px;width:100%;max-width:760px}
.act button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.act .no{border-color:var(--no);color:var(--no)}.act .ok{border-color:var(--ok);color:var(--ok)}
.act .no:hover{background:var(--no);color:#fff}.act .ok:hover{background:var(--ok);color:#fff}
.act .nav{flex:.5;font-weight:500}
.kw{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kw summary{cursor:pointer;font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{background:var(--bg);border:1px solid var(--line);padding:3px 10px;border-radius:99px;font-size:13px}
.cai{font-size:14px;color:var(--mut);margin-top:10px}
.done{text-align:center;padding:40px 20px;background:var(--card);border-radius:18px;box-shadow:var(--sh);width:100%;max-width:760px}
.done h2{margin:0 0 6px}
.done .big{font-size:42px;font-weight:800}
.done button{margin:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.menu{display:none}
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{position:fixed;inset:0 25% 0 0;z-index:10;transform:translateX(-105%);transition:transform .25s;max-height:none;box-shadow:var(--sh);width:min(88vw,340px)}
 aside.open{transform:none}
 .menu{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px;align-self:flex-start}
 main{padding:14px 12px}
 .face{padding:22px 18px}
 .card{min-height:340px}
}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;background:var(--bg)}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <h1>Flashcards USP Bauru</h1>
  <div class="sub">USP Bauru · <span id="tot"></span> cartões · progresso salvo neste navegador</div>

  <div style="font-size:12px;color:var(--mut);text-align:center">Atalhos: <kbd>Espaço</kbd> virar · <kbd>←</kbd><kbd>→</kbd> navegar · <kbd>1</kbd> errei · <kbd>2</kbd> acertei</div>
</main>
</div>

  stg.innerHTML=`
  <div class="cardwrap"><div class="card${flipped?" flip":""}" id="card">
    <div class="face front"><div class="lab">${c.tema.length>60?c.tema.slice(0,58)+"…":c.tema} · ${lblF}${cur===1?" · <span style='color:var(--no)'>errado antes</span>":cur===2?" · <span style='color:var(--ok)'>já acertou</span>":""}</div><div class="txt">${front}</div><div class="hint">toque para virar</div></div>
    <div class="face back"><div class="lab">${lblB}</div><div class="txt">${back}</div></div>
  </div></div>
  <div class="act"><button class="nav" id="pv">←</button><button class="no" id="bn">✗ Errei</button><button class="ok" id="bo">✓ Acertei</button><button class="nav" id="nx">→</button></div>`;
  $("card").onclick=flip;$("pv").onclick=prev;$("nx").onclick=next;$("bn").onclick=()=>mark(1);$("bo").onclick=()=>mark(2);
  $("cnt").textContent=`Cartão ${idx+1} de ${deck.length}`;$("pg").style.width=(idx/deck.length*100)+"%";
}
function flip(){flipped=!flipped;const c=$("card");if(c)c.classList.toggle("flip",flipped)}
function next(){if(idx<deck.length){idx++;flipped=false;render()}}
function prev(){if(idx>0){idx--;flipped=false;render()}}
function mark(v){
  if(!deck[idx])return;
  st[deck[idx].id]=v;save();v===2?sess.ok++:sess.no++;
  renderNav();idx++;flipped=false;render();
}
function closeSide(){$("side").classList.remove("open")}
$("menu").onclick=()=>$("side").classList.toggle("open");
$("bAll").onclick=()=>{sel={type:"all"};build(false)};
$("bMiss").onclick=()=>{onlyMiss=!onlyMiss;build(false)};
$("bReset").onclick=()=>{if(confirm("Zerar todo o progresso salvo?")){st={};save();build(false)}};
$("bShuf").onclick=()=>build(true);
$("bRev").onclick=()=>{rev=!rev;$("bRev").classList.toggle("on",rev);flipped=false;render()};
$("bTheme").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#12151c";r.dataset.theme=d?"light":"dark"};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="BUTTON"&&e.key===" ")e.preventDefault();
  if(e.key===" "){e.preventDefault();flip()}
  else if(e.key==="ArrowRight")next();else if(e.key==="ArrowLeft")prev();
  else if(e.key==="1")mark(1);else if(e.key==="2")mark(2);
});
build(false);
</script>
</body>
</html>
